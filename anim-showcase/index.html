<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" href="assets/mark-clean.svg"/>
<title>animation showcase — spin + flip</title>
<meta name="description" content="One spins forever, one flips on loop: the superbot site intro's app sphere spinning 3d around each other, and the tile's uno-card flip turnover."/>
<!-- Source of truth: site/site/assets/sphere-intro-28.js (spin beat + fv-flip-icon-grow runFinisher) and ads/superbot-spin-merge (self-contained extraction). Live: https://singularitystudiosdev.github.io/cloned-xdxdxd/anim-showcase/ -->
<style>
  /* ============ tokens: superbot.gg site.css, verbatim (superbot-spin-merge) ============ */
  :root {
    --bg: #000000; --card: #0d0d0d; --raised: #181818; --line: #262626;
    --fg: #ececec; --muted: #9a9a9a;
    --surface: #181818;
    --brand-openai: #000000;    --brand-openai-ink: #ffffff;
    --brand-claude: #d97757;    --brand-claude-ink: #ffffff;
    --brand-gemini: #ffffff;    --brand-gemini-ink: #1f1f1f;
    --brand-cursor: #000000;    --brand-cursor-ink: #ffffff;
    --brand-vscode: #0078d4;    --brand-vscode-ink: #ffffff;
    --brand-zed: #084ccf;       --brand-zed-ink: #ffffff;
    --brand-windsurf: #0b100f;  --brand-windsurf-ink: #58e5bb;
    --brand-copilot: #24292f;   --brand-copilot-ink: #ffffff;
    --font-ui: "SF Pro Rounded", "SF Pro Display", -apple-system, system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 40px 16px; }

  .row { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: start; }
  .cell { display: grid; gap: 14px; justify-items: center; }

  /* the little square each animation plays in — square, bordered, dark */
  .box { position: relative; width: min(360px, 88vw); aspect-ratio: 1 / 1; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .cap { font-size: 14px; color: var(--muted); letter-spacing: .02em; text-align: center; max-width: min(360px, 88vw); }

  /* ============ box 1: the sphere choreography, rendered as plain white tiles ============ */
  .rail-item { position: absolute; width: 54px; height: 54px; border-radius: 14px; background: #ffffff; opacity: 0; }

  .sphere { position: absolute; inset: 0; overflow: hidden; }
  /* the sphere's fixed 460px coordinate space, scaled to fit the square */
  .holder { position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; transform: translate(-50%, -50%); transform-style: preserve-3d; perspective: 1100px; }

  /* ============ box 2: the uno-card tile flips and lands — plain white face ============ */
  .bloom-wrap { position: absolute; left: 50%; top: 50%; width: 250px; height: 250px; margin: -125px 0 0 -125px; opacity: 0; will-change: transform, opacity; }
  .bloom { position: absolute; inset: 0; will-change: transform, filter; }
  .card-face { position: absolute; inset: 0; background: #ffffff; border-radius: 28px; }
</style>
</head>
<body>
<div class="row">
  <div class="cell">
    <div class="box" id="boxA">
      <div class="sphere"><div class="holder" id="holder"></div></div>
    </div>
    <p class="cap">Spinning 3d around each other in a circle</p>
  </div>
  <div class="cell">
    <div class="box" id="boxB">
      <div class="bloom-wrap" id="bloomWrap"><div class="bloom" id="bloom"><div class="card-face"></div></div></div>
    </div>
    <p class="cap">3d Flip Uno Card Turnover</p>
  </div>
</div>
<script>
(() => {
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp01 = (t) => Math.min(1, Math.max(0, t));

  // ---------- scale each box's fixed 460px design space to its square ----------
  const boxA = document.getElementById("boxA"), boxB = document.getElementById("boxB");
  const holder = document.getElementById("holder"), bloomWrap = document.getElementById("bloomWrap");
  const DESIGN = 460;
  const fit = () => {
    for (const [box, el] of [[boxA, holder], [boxB, bloomWrap]]) {
      const s = box.clientWidth / DESIGN;
      el.style.transform = (el === bloomWrap ? "" : "translate(-50%,-50%) ") + "scale(" + s + ")";
    }
  };
  // the bloom-wrap's rest transform keeps its centering margin; only the scale varies
  fit(); addEventListener("resize", fit);

  // ---------- box 1: the sphere choreography, rendered as plain white tiles ----------
  const N = 18;
  const C = DESIGN / 2, R = 175, TILE = 54;
  const rotY3 = (v, a) => ({ x: v.x * Math.cos(a) + v.z * Math.sin(a), y: v.y, z: -v.x * Math.sin(a) + v.z * Math.cos(a) });
  const fibDirs = (n) => Array.from({ length: n }, (_, i) => {
    const y = 1 - (2 * i + 1) / n;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = 2.399963 * i;
    return { x: Math.cos(th) * r, y, z: Math.sin(th) * r };
  });
  const POP_START = 120, POP_STAGGER = 60;
  const popAt = (i) => POP_START + i * POP_STAGGER;
  const SPINUP_T = 4000;
  const OMEGA0 = 0.35, OMEGA_MAX = 21, OMEGA_CRUISE = 2.4;
  // the site's exact exponential spin-up curve, capped at a cruise speed —
  // no merge: the sphere just keeps spinning forever
  const omegaAt = (tMs) => {
    const x = clamp01(tMs / SPINUP_T);
    return Math.min(OMEGA_CRUISE, OMEGA0 * Math.exp(Math.log(OMEGA_MAX / OMEGA0) * Math.pow(x, 1.55)));
  };
  const FIB = fibDirs(N);
  const tiles = Array.from({ length: N }, () => {
    const t = document.createElement("span");
    t.className = "rail-item";
    t.style.cssText = "position:absolute;left:0;top:0;width:" + TILE + "px;height:" + TILE + "px;will-change:transform,opacity,filter;opacity:0;";
    holder.appendChild(t);
    return t;
  });
  const place3 = (el, x, y, z) => { el.style.transform = "translate3d(" + (C - TILE / 2 + x) + "px," + (C - TILE / 2 + y) + "px," + z + "px)"; };

  // the spin angle is the integral of omega, advanced in 1ms steps; the clock
  // never wraps, so the sphere spins forever without a reset jump
  let ang = 0, angClock = 0;
  const advanceAng = (to) => {
    for (let t = angClock; t < to; t += 1) ang += 0.001 * omegaAt(t + 0.5);
    angClock = to;
  };
  const renderSphere = (clock) => {
    advanceAng(clock);
    for (let i = 0; i < N; i++) {
      const el = tiles[i];
      if (clock < popAt(i)) { el.style.opacity = "0"; continue; }
      const v = rotY3(FIB[i], ang);
      const x = v.x * R, y = v.y * R, z = v.z * R;
      const depth = (z + 190) / 380;
      place3(el, x, y, z);
      el.style.opacity = String(0.16 + 0.84 * depth);
      const blur = depth < 0.5 ? (0.5 - depth) * 3 : 0;
      el.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
    }
  };

  // ---------- box 2: fv-flip-icon-grow, exact (sphere-intro runFinisher) —
  // 0→0.76 flip 180°→0° + grow + brighten, 920ms, then hold, fade, loop ----------
  const bloom = document.getElementById("bloom");
  // the loop: flip 0-920 · hold to 1820 · wrapper fades out 1820-2060 · restart
  const HOLD_END = 1820, LOOP_END = 2060;
  const cues = [];
  const cue = (el, keyframes, opts) => {
    const a = el.animate(keyframes, Object.assign({ fill: "both" }, opts));
    a.pause();
    cues.push({ a, dur: opts.duration });
    return a;
  };
  cue(bloom, [
    { transform: "perspective(900px) rotateY(180deg) scale(" + (TILE / 250) + ")", filter: "brightness(0.5)", easing: "cubic-bezier(.3,.85,.3,1.04)" },
    { transform: "perspective(900px) rotateY(0deg) scale(1.05)", filter: "brightness(1)", offset: 0.76, easing: "ease-out" },
    { transform: "scale(1)", filter: "brightness(1)" },
  ], { duration: 920 });
  cue(bloomWrap, [
    { opacity: 1 },
    { opacity: 1, offset: HOLD_END / LOOP_END, easing: "cubic-bezier(0.4, 0, 1, 1)" },
    { opacity: 0 },
  ], { duration: LOOP_END });
  const renderFlip = (clock) => { for (const c of cues) c.a.currentTime = Math.min(c.dur, Math.max(0, clock)); };

  if (REDUCE) { renderSphere(2600); renderFlip(920); return; } // held at cruise spin + landed tile

  // ---------- one rAF, two independent loop clocks ----------
  let aClock = 0, bClock = 0, last = null;
  const frame = (ts) => {
    if (last == null) last = ts;
    const dMs = Math.min(50, ts - last);
    last = ts;
    aClock = aClock + dMs; // spins forever, no loop reset
    bClock = (bClock + dMs) % LOOP_END;
    renderSphere(aClock);
    renderFlip(bClock);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
