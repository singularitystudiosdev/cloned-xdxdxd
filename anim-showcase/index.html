<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" href="assets/mark-clean.svg"/>
<title>animation showcase — spin + flip</title>
<meta name="description" content="Two loops from the superbot site intro: the app sphere spinning 3d around each other, and the tile's uno-card flip turnover."/>
<style>
  /* ============ tokens: superbot.gg site.css, verbatim (superbot-spin-merge) ============ */
  :root {
    --bg: #000000; --card: #0d0d0d; --raised: #181818; --line: #262626;
    --fg: #ececec; --muted: #9a9a9a;
    --surface: #181818;
    --brand-openai: #000000;    --brand-openai-ink: #ffffff;
    --brand-claude: #d97757;    --brand-claude-ink: #ffffff;
    --brand-gemini: #ffffff;    --brand-gemini-ink: #1f1f1f;
    --brand-cursor: #000000;    --brand-cursor-ink: #ffffff;
    --brand-vscode: #0078d4;    --brand-vscode-ink: #ffffff;
    --brand-zed: #084ccf;       --brand-zed-ink: #ffffff;
    --brand-windsurf: #0b100f;  --brand-windsurf-ink: #58e5bb;
    --brand-copilot: #24292f;   --brand-copilot-ink: #ffffff;
    --font-ui: "SF Pro Rounded", "SF Pro Display", -apple-system, system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 40px 16px; }

  .row { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; align-items: start; }
  .cell { display: grid; gap: 14px; justify-items: center; }

  /* the little square each animation plays in — square, bordered, dark */
  .box { position: relative; width: min(360px, 88vw); aspect-ratio: 1 / 1; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .cap { font-size: 14px; color: var(--muted); letter-spacing: .02em; text-align: center; max-width: min(360px, 88vw); }

  /* ============ box 1: the sphere — hub-boot.css .rail-item, verbatim ============ */
  .rail-item { position: relative; flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--surface); display: grid; place-items: center; color: var(--fg); opacity: 0; }
  .rail-item svg { width: 26px; height: 26px; }
  .rail-item[data-app="openai"]   { background: var(--brand-openai);   color: var(--brand-openai-ink);   box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .rail-item[data-app="claude"]   { background: var(--brand-claude);   color: var(--brand-claude-ink); }
  .rail-item[data-app="gemini"]   { background: var(--brand-gemini);   color: var(--brand-gemini-ink); }
  .rail-item[data-app="cursor"]   { background: var(--brand-cursor);   color: var(--brand-cursor-ink);   box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .rail-item[data-app="copilot"]  { background: var(--brand-copilot);  color: var(--brand-copilot-ink);  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .rail-item.bleed { background: #000; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .rail-item.bleed img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }

  .sphere { position: absolute; inset: 0; overflow: hidden; }
  /* the sphere's fixed 460px coordinate space, scaled to fit the square */
  .holder { position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; transform: translate(-50%, -50%); transform-style: preserve-3d; perspective: 1100px; }

  /* ============ box 2: the brand tile (brand/tile.svg) flips and lands ============ */
  .bloom-wrap { position: absolute; left: 50%; top: 50%; width: 250px; height: 250px; margin: -125px 0 0 -125px; opacity: 0; will-change: transform, opacity; }
  .bloom { position: absolute; inset: 0; will-change: transform, filter; }
  .bloom img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>

<div class="row">
  <div class="cell">
    <div class="box" id="boxA">
      <div class="sphere"><div class="holder" id="holder"></div></div>
    </div>
    <p class="cap">Spinning 3d around each other in a circle</p>
  </div>
  <div class="cell">
    <div class="box" id="boxB">
      <div class="bloom-wrap" id="bloomWrap"><div class="bloom" id="bloom"><img src="assets/tile.svg" alt="" draggable="false"/></div></div>
    </div>
    <p class="cap">3d Flip Uno Card Turnover</p>
  </div>

<script>
(() => {
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = (t) => Math.min(1, Math.max(0, t));

  // ---------- scale each box's fixed 460px design space to its square ----------
  const boxA = document.getElementById("boxA"), boxB = document.getElementById("boxB");
  const holder = document.getElementById("holder"), bloomWrap = document.getElementById("bloomWrap");
  const DESIGN = 460;
  const fit = () => {
    for (const [box, el] of [[boxA, holder], [boxB, bloomWrap]]) {
      const s = box.clientWidth / DESIGN;
      el.style.transform = (el === bloomWrap ? "" : "translate(-50%,-50%) ") + "scale(" + s + ")";
    }
  };
  // the bloom-wrap's rest transform keeps its centering margin; only the scale varies
  fit(); addEventListener("resize", fit);

  // ---------- box 1: the site's sphere (sphere-intro-28 / superbot-spin-merge, exact) ----------
  const SPIN = [
    { app: "openai" }, { app: "claude" }, { app: "gemini" }, { app: "cursor" },
    { app: "devin", name: "Devin", img: "assets/devin.png" },
    { app: "hermes", name: "Hermes", img: "assets/hermes.png" },
    { app: "grok", name: "Grok", img: "assets/grok.png" },
    { app: "copilot", name: "GitHub Copilot" },
    { name: "Kiro", img: "assets/kiro.ico" },
    { name: "VS Code", sym: "vscode", bg: "var(--brand-vscode)", ink: "var(--brand-vscode-ink)" },
    { name: "Windsurf", sym: "windsurf", bg: "var(--brand-windsurf)", ink: "var(--brand-windsurf-ink)" },
    { name: "Replit", logo: "assets/replit.png", bg: "var(--surface)" },
    { name: "Lovable", logo: "assets/lovable.png", bg: "#ffffff" },
    { name: "Zed", sym: "zed", bg: "var(--brand-zed)", ink: "var(--brand-zed-ink)" },
    { name: "JetBrains", logo: "assets/jetbrains.png", bg: "var(--surface)" },
    { name: "Bolt", img: "assets/bolt.png" },
    { name: "Base44", logo: "assets/base44.png", bg: "var(--surface)" },
    { name: "v0", logo: "assets/v0.svg", bg: "#000000" },
  ];
  const N = SPIN.length;
  const C = DESIGN / 2, R = 175, TILE = 54;
  const rotY3 = (v, a) => ({ x: v.x * Math.cos(a) + v.z * Math.sin(a), y: v.y, z: -v.x * Math.sin(a) + v.z * Math.cos(a) });
  const fibDirs = (n) => Array.from({ length: n }, (_, i) => {
    const y = 1 - (2 * i + 1) / n;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = 2.399963 * i;
    return { x: Math.cos(th) * r, y, z: Math.sin(th) * r };
  });
  const POP_START = 120, POP_STAGGER = 60;
  const popAt = (i) => POP_START + i * POP_STAGGER;
  const MERGE_T = 4000;
  const OMEGA0 = 0.35, OMEGA_MAX = 21;
  const omegaAt = (tMs) => {
    const x = clamp01(tMs / MERGE_T);
    return OMEGA0 * Math.exp(Math.log(OMEGA_MAX / OMEGA0) * Math.pow(x, 1.55));
  };
  const FIB = fibDirs(N);
  const HAIRLINE = "inset 0 0 0 1px rgb(255 255 255 / .14)";
  const tiles = SPIN.map((a) => {
    const t = document.createElement("span");
    t.className = "rail-item" + (a.img ? " bleed" : "");
    if (a.app) t.dataset.app = a.app;
    t.title = a.name || a.app;
    t.style.cssText = "position:absolute;left:0;top:0;width:" + TILE + "px;height:" + TILE + "px;will-change:transform,opacity,filter;opacity:0;";
    if (a.img) {
      const img = new Image(); img.src = a.img; img.alt = ""; img.draggable = false; t.appendChild(img);
    } else if (a.logo) {
      t.style.background = a.bg; t.style.boxShadow = HAIRLINE;
      const img = new Image(); img.src = a.logo; img.alt = ""; img.draggable = false;
      img.style.cssText = "width:60%;height:60%;object-fit:contain;display:block;"; t.appendChild(img);
    } else {
      if (a.sym) { t.style.background = a.bg; t.style.color = a.ink; t.style.boxShadow = HAIRLINE; }
      t.innerHTML = '<svg><use href="#sb-ic-' + (a.sym || a.app) + '"/></svg>';
      const svg = t.querySelector("svg"); svg.style.width = "31px"; svg.style.height = "31px";
    }
    holder.appendChild(t);
    return t;
  });
  const place3 = (el, x, y, z) => { el.style.transform = "translate3d(" + (C - TILE / 2 + x) + "px," + (C - TILE / 2 + y) + "px," + z + "px)"; };

  // the spin angle is the integral of omega, advanced in 1ms steps so every
  // loop wraps onto the same angle trajectory
  let ang = 0, angClock = 0;
  const advanceAng = (to) => {
    if (to < angClock) { ang = 0; angClock = 0; }
    const end = Math.min(to, MERGE_T);
    for (let t = angClock; t < end; t += 1) ang += 0.001 * omegaAt(t + 0.5);
    angClock = to;
  };
  const renderSphere = (clock) => {
    advanceAng(clock);
    const gone = clock >= MERGE_T + 220;
    for (let i = 0; i < N; i++) {
      const el = tiles[i];
      if (gone || clock < popAt(i)) { el.style.opacity = "0"; continue; }
      const v = rotY3(FIB[i], ang);
      const mergeT = Math.pow(clamp01((clock - (MERGE_T - 450)) / 450), 1.7);
      const x = lerp(v.x * R, 0, mergeT), y = lerp(v.y * R, 0, mergeT), z = v.z * lerp(R, 10, mergeT);
      const depth = (z + 190) / 380;
      place3(el, x, y, z);
      el.style.opacity = String(Math.min(1, (0.16 + 0.84 * depth) * (1 - clamp01((clock - MERGE_T) / 220))));
      const blurT = clamp01((clock - MERGE_T * 0.62) / (MERGE_T * 0.38));
      const blur = Math.pow(blurT, 2) * 3.6 + (depth < 0.5 ? (0.5 - depth) * 3 : 0);
      el.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
    }
  };

  // ---------- box 2: fv-flip-icon-grow, exact (sphere-intro runFinisher) —
  // 0→0.76 flip 180°→0° + grow + brighten, 920ms, then hold, fade, loop ----------
  const bloom = document.getElementById("bloom");
  // the loop: flip 0-920 · hold to 1820 · wrapper fades out 1820-2060 · restart
  const HOLD_END = 1820, LOOP_END = 2060;
  const cues = [];
  const cue = (el, keyframes, opts) => {
    const a = el.animate(keyframes, Object.assign({ fill: "both" }, opts));
    a.pause();
    cues.push({ a, dur: opts.duration });
    return a;
  };
  cue(bloom, [
    { transform: "perspective(900px) rotateY(180deg) scale(" + (TILE / 250) + ")", filter: "brightness(0.5)", easing: "cubic-bezier(.3,.85,.3,1.04)" },
    { transform: "perspective(900px) rotateY(0deg) scale(1.05)", filter: "brightness(1)", offset: 0.76, easing: "ease-out" },
    { transform: "scale(1)", filter: "brightness(1)" },
  ], { duration: 920 });
  cue(bloomWrap, [
    { opacity: 1 },
    { opacity: 1, offset: HOLD_END / LOOP_END, easing: "cubic-bezier(0.4, 0, 1, 1)" },
    { opacity: 0 },
  ], { duration: LOOP_END });
  const renderFlip = (clock) => { for (const c of cues) c.a.currentTime = Math.min(c.dur, Math.max(0, clock)); };

  if (REDUCE) { renderSphere(MERGE_T + 220); renderFlip(920); return; } // tiles merged away + landed tile — a frame the real sequence ends on

  // ---------- one rAF, two independent loop clocks ----------
  let aClock = 0, bClock = 0, last = null;
  const frame = (ts) => {
    if (last == null) last = ts;
    const dMs = Math.min(50, ts - last);
    last = ts;
    aClock = (aClock + dMs) % (MERGE_T + 440); // converge+fade, beat of dark, re-pop
    bClock = (bClock + dMs) % LOOP_END;
    renderSphere(aClock);
    renderFlip(bClock);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
